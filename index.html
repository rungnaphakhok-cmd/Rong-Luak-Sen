<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านโรงลวกเส้น - อร่อย เข้มข้น เส้นเหนียวนุ่ม</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Prompt Font -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-amber-50 text-gray-800 pb-20">

    <!-- Header / Navigation -->
    <nav class="bg-red-800 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold flex items-center gap-2">
                🍜 โรงลวกเส้น
            </a>
            <div class="hidden md:flex space-x-6 font-medium items-center">
                <a href="#home" class="hover:text-amber-300 transition">หน้าแรก</a>
                <a href="#menu" class="hover:text-amber-300 transition">เมนูอาหาร</a>
                <a href="#about" class="hover:text-amber-300 transition">เกี่ยวกับร้าน</a>
                <a href="#contact" class="hover:text-amber-300 transition">ติดต่อเรา</a>
            </div>
            
            <!-- Cart Button -->
            <button onclick="toggleCartModal()" class="relative bg-amber-500 hover:bg-amber-600 text-red-950 font-bold px-4 py-2 rounded-full flex items-center gap-2 shadow-lg transition">
                🛒 <span>ตะกร้า</span>
                <span id="cart-count" class="bg-red-700 text-white text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="relative bg-amber-100 py-12 px-4 text-center">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl md:text-5xl font-extrabold text-red-900 mb-3">ร้านโรงลวกเส้น</h1>
            <p class="text-base md:text-lg text-amber-900 mb-6">ก๋วยเตี๋ยวเรือรสเด็ด ข้าวซอย ข้าวขาหมู และผัดกะเพราจัดจ้าน ชุมชนร่มเย็น</p>
            
            <!-- Search Bar -->
            <div class="max-w-md mx-auto relative">
                <input type="text" id="search-input" onkeyup="searchMenu()" placeholder="🔍 ค้นหาเมนูอาหาร..." class="w-full px-4 py-3 rounded-full border-2 border-red-300 focus:outline-none focus:border-red-700 shadow-sm text-sm md:text-base">
            </div>
        </div>
    </section>

    <!-- Menu Section -->
    <section id="menu" class="max-w-7xl mx-auto py-10 px-4">
        <h2 class="text-3xl font-bold text-center text-red-900 mb-6">รายการเมนูอาหาร</h2>
        
        <!-- Category Filter Tabs -->
        <div class="flex flex-wrap justify-center gap-2 mb-8" id="category-tabs">
            <button onclick="filterMenu('all')" class="tab-btn bg-red-800 text-white px-4 py-2 rounded-full text-xs md:text-sm font-medium shadow">ทั้งหมด</button>
            <button onclick="filterMenu('promo')" class="tab-btn bg-white hover:bg-red-100 text-gray-800 px-4 py-2 rounded-full text-xs md:text-sm font-medium border border-gray-300">🔥 โปรโมชัน (3)</button>
            <button onclick="filterMenu('soup')" class="tab-btn bg-white hover:bg-red-100 text-gray-800 px-4 py-2 rounded-full text-xs md:text-sm font-medium border border-gray-300">🍜 ก๋วยเตี๋ยวน้ำ (4)</button>
            <button onclick="filterMenu('dry')" class="tab-btn bg-white hover:bg-red-100 text-gray-800 px-4 py-2 rounded-full text-xs md:text-sm font-medium border border-gray-300">🥢 ก๋วยเตี๋ยวแห้ง (5)</button>
            <button onclick="filterMenu('khao-soi')" class="tab-btn bg-white hover:bg-red-100 text-gray-800 px-4 py-2 rounded-full text-xs md:text-sm font-medium border border-gray-300">🍲 ข้าวซอย (3)</button>
            <button onclick="filterMenu('pork-leg')" class="tab-btn bg-white hover:bg-red-100 text-gray-800 px-4 py-2 rounded-full text-xs md:text-sm font-medium border border-gray-300">🍖 ข้าวขาหมู (3)</button>
            <button onclick="filterMenu('kaprao')" class="tab-btn bg-white hover:bg-red-100 text-gray-800 px-4 py-2 rounded-full text-xs md:text-sm font-medium border border-gray-300">🌶️ กะเพรา (8)</button>

            <button onclick="filterMenu('kubkhao')" class="tab-btn bg-white hover:bg-red-100 text-gray-800 px-4 py-2 rounded-full text-xs md:text-sm font-medium border border-gray-300">🥘 กับข้าว (3)</button>
            <button onclick="filterMenu('dessert-drink')" class="tab-btn bg-white hover:bg-red-100 text-gray-800 px-4 py-2 rounded-full text-xs md:text-sm font-medium border border-gray-300">🧋 ขนม/เครื่องดื่ม (5)</button>
        </div>

        <!-- Menu Cards Grid -->
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- เมนูจะถูกสร้างอัตโนมัติผ่าน JavaScript -->
        </div>
    </section>

    <!-- Modal ตัวเลือกอาหาร (เส้น / ท็อปปิ้ง / ความเผ็ด) -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeCustomModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            <h3 id="modal-title" class="text-xl font-bold text-red-900 mb-2">ชื่อเมนู</h3>
            <p id="modal-price" class="text-lg font-semibold text-red-700 mb-4">0 ฿</p>

            <!-- ตัวเลือกเส้น -->
            <div id="noodle-options-group" class="mb-4 hidden">
                <label class="block text-sm font-bold text-gray-700 mb-2">เลือกประเภทเส้น <span class="text-red-500">*</span></label>
                <select id="select-noodle" class="w-full p-2.5 border rounded-lg focus:ring-red-500 focus:border-red-500">
                    <option value="เส้นเล็ก">เส้นเล็ก</option>
                    <option value="เส้นใหญ่">เส้นใหญ่</option>
                    <option value="เส้นหมี่">เส้นหมี่ขาว</option>
                    <option value="บะหมี่">บะหมี่เหลือง</option>
                    <option value="วุ้นเส้น">วุ้นเส้น</option>
                    <option value="มาม่า">มาม่า (+5 ฿)</option>
                </select>
            </div>

            <!-- ตัวเลือกระดับความเผ็ด -->
            <div id="spicy-options-group" class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">ระดับความเผ็ด</label>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <label class="flex items-center space-x-2 border p-2 rounded cursor-pointer hover:bg-amber-50">
                        <input type="radio" name="spicy" value="ไม่เผ็ด" class="text-red-600 focus:ring-red-500">
                        <span>ไม่เผ็ด</span>
                    </label>
                    <label class="flex items-center space-x-2 border p-2 rounded cursor-pointer hover:bg-amber-50">
                        <input type="radio" name="spicy" value="เผ็ดน้อย" class="text-red-600 focus:ring-red-500">
                        <span>เผ็ดน้อย</span>
                    </label>
                    <label class="flex items-center space-x-2 border p-2 rounded cursor-pointer hover:bg-amber-50">
                        <input type="radio" name="spicy" value="เผ็ดปกติ" checked class="text-red-600 focus:ring-red-500">
                        <span>เผ็ดปกติ</span>
                    </label>
                    <label class="flex items-center space-x-2 border p-2 rounded cursor-pointer hover:bg-amber-50">
                        <input type="radio" name="spicy" value="เผ็ดมาก" class="text-red-600 focus:ring-red-500">
                        <span>เผ็ดมาก 🔥</span>
                    </label>
                </div>
            </div>

            <!-- ตัวเลือกท็อปปิ้งเพิ่มเติม -->
            <div id="topping-options-group" class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">ท็อปปิ้งเพิ่มเติม (เลือกได้หลายอย่าง)</label>
                <div class="space-y-2 text-sm">
                    <label class="flex justify-between items-center border p-2 rounded cursor-pointer hover:bg-amber-50">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" value="ไข่ยางมะตอย" data-price="10" class="topping-cb text-red-600">
                            <span>ไข่ต้มยางมะตอย</span>
                        </div>
                        <span class="text-gray-500">+10 ฿</span>
                    </label>
                    <label class="flex justify-between items-center border p-2 rounded cursor-pointer hover:bg-amber-50">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" value="กากหมูกรอบ" data-price="15" class="topping-cb text-red-600">
                            <span>กากหมูกรอบเจียว</span>
                        </div>
                        <span class="text-gray-500">+15 ฿</span>
                    </label>
                    <label class="flex justify-between items-center border p-2 rounded cursor-pointer hover:bg-amber-50">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" value="ลูกชิ้นเพิ่ม" data-price="15" class="topping-cb text-red-600">
                            <span>เพิ่มลูกชิ้น (4 ลูก)</span>
                        </div>
                        <span class="text-gray-500">+15 ฿</span>
                    </label>
                    <label class="flex justify-between items-center border p-2 rounded cursor-pointer hover:bg-amber-50">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" value="เกี๊ยวทอด" data-price="10" class="topping-cb text-red-600">
                            <span>เกี๊ยวทอดกรอบ</span>
                        </div>
                        <span class="text-gray-500">+10 ฿</span>
                    </label>
                </div>
            </div>

            <button onclick="confirmAddToCart()" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-xl transition shadow-md">
                เพิ่มลงตะกร้า 🛒
            </button>
        </div>
    </div>

    <!-- Modal ตะกร้าสินค้า และสรุปยอดเงิน -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] flex flex-col">
            <button onclick="toggleCartModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            <h3 class="text-2xl font-bold text-red-900 mb-4 border-b pb-2">🛒 ตะกร้าสินค้าของคุณ</h3>

            <div id="cart-items" class="flex-1 overflow-y-auto space-y-3 mb-4 pr-1">
                <!-- รายการในตะกร้าจะถูกแสดงที่นี่ -->
            </div>

            <div class="border-t pt-4 space-y-3">
                <div class="flex justify-between text-lg font-bold">
                    <span>ยอดรวมทั้งหมด:</span>
                    <span id="cart-total" class="text-red-700">0 ฿</span>
                </div>
                
                <button onclick="orderViaLineMan()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 transition text-base">
                    <span>🛵 สั่งซื้อผ่านแอป LINE MAN</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
